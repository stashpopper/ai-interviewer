# Netlify reads netlify.toml from the repository root only.
# See apps/frontend/netlify.toml for redirect details (kept in sync).

[build]
  base = "apps/frontend"
  command = "bun run build"
  publish = "dist"

[build.environment]
  VITE_BACKEND_URL = "https://ai-interviewer-ky0h.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://ai-interviewer-ky0h.onrender.com/api/:splat"
  status = 200
  force = true
